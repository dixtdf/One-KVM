name: Build custom One-KVM ARM64
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_NET_RETRY: "5"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out build configuration
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: custom
      - name: Check out pinned One-KVM source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: mofeng-git/One-KVM
          ref: b5d13ee16e099df4082e1da96a37db0888c57bb7
          path: source
          persist-credentials: false
      - name: Prepare exact source and patch
        run: python3 custom/scripts/prepare.py source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.11.0"
      - name: Build frontend with type checks
        working-directory: source/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Test patched config and custom values
        run: python3 custom/scripts/test-config.py source custom/test-harness
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build ARM64 using pinned Debian 12 image
        working-directory: source
        run: bash build/build-images.sh arm64
      - name: Package ARM64 DEB
        working-directory: source
        run: bash build/package-deb.sh arm64
      - name: Collect packages and corresponding source
        run: |
          cp source/target/debian/*arm64.deb custom/out/
          git -C source archive --format=tar --prefix=one-kvm/ HEAD | gzip > custom/out/upstream-source.tar.gz
          cp custom/patches/*.patch custom/out/
          cp custom/pins.json custom/out/
          cp source/web/package-lock.json custom/out/frontend-package-lock.json
          cp source/LICENSE custom/out/LICENSE
          cp custom/README.md custom/out/README.md
          cd custom/out
          sha256sum *.deb *.patch *.tar.gz > SHA256SUMS
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: one-kvm-custom-arm64
          path: custom/out/
          retention-days: 30
          if-no-files-found: error
